name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Show coverage
        if: runner.os == 'Linux'
        run: go tool cover -func coverage.out

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Fuzz short run (10s per target)
        run: |
          go test -run '^$' -fuzz '^FuzzVerify$' -fuzztime=10s ./password/
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime=10s ./token/
          go test -run '^$' -fuzz '^FuzzRBAC$' -fuzztime=10s ./rbac/
          go test -run '^$' -fuzz '^FuzzTOTP$' -fuzztime=10s ./mfa/
          go test -run '^$' -fuzz '^FuzzSessionStore$' -fuzztime=10s ./session/
          go test -run '^$' -fuzz '^FuzzLoginGuard$' -fuzztime=10s ./security/
          go test -run '^$' -fuzz '^FuzzAuditEvent$' -fuzztime=10s ./audit/
          go test -run '^$' -fuzz '^FuzzCSRF$' -fuzztime=10s ./middleware/
          go test -run '^$' -fuzz '^FuzzOAuth2Config$' -fuzztime=10s ./oauth2/

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
